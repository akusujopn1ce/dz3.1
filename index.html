<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <body>
    <script>
      let N = parseInt(prompt("Введіть ціле число N:"));

      if (!isNaN(N)) {
        document.write(`Числа від 1 до 100, квадрат яких не перевищує ${N}: <br><br>`);
  
        for (let i = 1; i <= 100; i++) {
    
          if (i * i <= N) {
            document.write(i + " "); 
          } else {
           break; 
          }
    
       }
      } else {
       document.write("Ви не ввели коректне число.");
      }
    </script>
  </body>
</html>
