<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <body>
    <script>
      let number = parseInt(prompt("Введіть ціле число:"));

        if (!isNaN(number)) {
          
          let isPrime = true;

          if (number <= 1) {
            isPrime = false;
          } else {
            for (let i = 2; i < number; i++) {
              
              if (number % i === 0) {
                isPrime = false; 
                break;           
              }
      
            }
          }

          if (isPrime) {
            document.write(`Число ${number} є простим.`);
          } else {
            document.write(`Число ${number} НЕ є простим.`);
          }

        } else {
          document.write("Ви не ввели коректне число.");
        }
    </script>
  </body>
</html>
