<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <body>
    <script>
      const numbers = [15, 2, 8, 43, 10, 7, 24];

      const evenNumbers = numbers.filter(function(number) {
        return number % 2 === 0; 
      });

      document.write(`Оригінальний масив: ${numbers.join(", ")} <br>`);
      document.write(`Новий масив з парними числами: ${evenNumbers.join(", ")}`);
    </script>
  </body> 
</html>
