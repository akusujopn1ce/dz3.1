<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віджет Погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-widget">
        <div class="widget-left">
            <div class="current-date" id="current-date">-- --, ---- - --</div>
            <div class="current-time-block">
                <span class="time-big" id="current-time">--:--</span>
                <span class="time-ampm" id="current-ampm">--</span>
            </div>
            
            <div class="weather-details">
                <div>Humidity: <span id="humidity">--</span>%</div>
                <div>Pressure: <span id="pressure">--</span> hPa</div>
                <div>Wind: <span id="wind-speed">--</span> km/h <span id="wind-dir"></span></div>
            </div>
        </div>

        <div class="widget-right">
            <img id="weather-icon" src="" alt="Weather Icon" style="display: none;">
            <div class="temp-big"><span id="temp">--</span>°C</div>
            <div class="feels-like">Feels Like: <span id="feels-like">--</span>°C</div>
            <div class="description" id="description">--</div>
            
            <div class="update-info">
                <span id="last-update">--:--</span>
                <button id="refresh-btn" class="refresh-btn">↻</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
