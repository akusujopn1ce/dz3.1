<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <body>
    <script>
      const contactBook = {
        contacts: [
          { name: "Олександр", phone: "111-222", email: "alex@test.com" },
          { name: "Марія", phone: "333-444", email: "maria@test.com" }
        ],

        addContact: function(newName, newPhone, newEmail) {
          const newContact = { 
            name: newName, 
            phone: newPhone, 
            email: newEmail 
          };
          this.contacts.push(newContact);
          console.log("Додано новий контакт:", newName);
        },

        findContact: function(searchName) {
          const found = this.contacts.find(contact => contact.name === searchName);
          
          if (found) {
            console.log("Знайдено контакт:", found);
          } else {
            console.log("Контакт не знайдено.");
          }
        }
      };

      contactBook.addContact("Іван", "555-666", "ivan@test.com");  
      contactBook.findContact("Марія");  
    </script>
  </body>
</html>
