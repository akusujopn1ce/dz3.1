<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <script>
        const firstLine = prompt("Введіть перший рядок:");
        const secondLine = prompt("Введіть другий рядок:");
        const thirdLine = prompt("Введіть третій рядок:");

        console.log(`Ви ввели такі рядки: "${thirdLine}", "${firstLine}", "${secondLine}"`);
        
        alert(`Ваші рядки у змішаному порядку:\n1. ${secondLine}\n2. ${thirdLine}\n3. ${firstLine}`);
    </script>
</body>
</html>
