<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма зворотного зв'язку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-form">
        <h2 class="form-title">We would like to help you</h2>
        
        <form id="help-form">
            <!-- Поле: Name -->
            <div class="input-group">
                <input type="text" id="name" placeholder="Name">
                <span class="error-msg" id="error-name">Ім'я є обов'язковим полем</span>
            </div>

            <!-- Поле: Message -->
            <div class="input-group">
                <textarea id="message" placeholder="Message"></textarea>
                <span class="error-msg" id="error-message">Повідомлення має містити щонайменше 5 символів</span>
            </div>
            
            <h3 class="form-subtitle">HOW TO ANSWER YOU?</h3>
            
            <!-- Поле: Phone number -->
            <div class="input-group">
                <input type="tel" id="phone" placeholder="Phone number">
                <span class="error-msg" id="error-phone">Номер телефону має починатися з +380 та містити 13 символів</span>
            </div>

            <!-- Поле: Email -->
            <div class="input-group">
                <input type="email" id="email" placeholder="Email">
                <span class="error-msg" id="error-email">Email обов'язково повинен мати @ та крапку</span>
            </div>
            
            <button type="submit" id="submit-btn">Send message</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
