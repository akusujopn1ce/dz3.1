<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ООП Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Міні-калькулятор</h2>
        
        <div class="input-group">
            <input type="number" id="num-a" placeholder="Число A">
            <input type="number" id="num-b" placeholder="Число B">
        </div>

        <div class="actions">
            <button id="btn-add">Додати (+)</button>
            <button id="btn-sub">Відняти (-)</button>
            <button id="btn-mult">Помножити (*)</button>
            <button id="btn-div">Поділити (/)</button>
        </div>

        <div class="result-box">
            Результат: <span id="result">-</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
